services:
  checklist-offline:
    build: .
    image: checklist-offline:latest
    container_name: checklist-offline
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      API_BASE: ${API_BASE}
      TOKEN_APP: ${TOKEN_APP}
      APP_DEBUG: ${APP_DEBUG:-false}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.checklist-offline.rule=Host(`checklist.cmwtransportes.org`)"
      - "traefik.http.routers.checklist-offline.entrypoints=websecure"
      - "traefik.http.routers.checklist-offline.tls=true"
      - "traefik.http.routers.checklist-offline.tls.certresolver=letsencrypt"
      - "traefik.http.routers.checklist-offline.middlewares=global-headers@docker"
      - "traefik.http.services.checklist-offline.loadbalancer.server.port=80"

networks:
  web:
    external: true
